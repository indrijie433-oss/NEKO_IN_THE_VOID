<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAI - Your Soft Boy Bestie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0d1117;color:#e6edf3;height:100vh;display:flex}
.left{width:38%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;border-right:1px solid #ffffff0f;background:radial-gradient(600px at 40% 20%,#5a7cff18,transparent)}
.avatar{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8eeff,#8aa0ff 40%,#4a5fcf);display:flex;align-items:center;justify-content:center;font-size:85px;box-shadow:0 0 60px #6a80ff4d;transition:.3s}
.avatar.talk{transform:scale(1.05);box-shadow:0 0 80px #6a80ff7a}
.right{flex:1;display:flex;flex-direction:column;background:#0a0e14}
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:13px 17px;border-radius:20px;line-height:1.65;font-size:14.5px;white-space:pre-wrap}
.ai{background:#1c2335;align-self:flex-start;border-bottom-left-radius:6px}
.user{background:#4d6aff;align-self:flex-end;border-bottom-right-radius:6px;color:white}
.bar{padding:14px;border-top:1px solid #ffffff0f;display:flex;gap:10px;background:#111827}
.bar input{flex:1;background:#1f2937;border:1px solid #ffffff12;border-radius:99px;padding:13px 20px;color:white;outline:none;font-size:14px}
.bar button{background:white;color:black;border:none;border-radius:50%;width:46px;height:46px;cursor:pointer;font-size:18px}
.top{padding:12px 18px;border-bottom:1px solid #ffffff0a;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.dot{width:8px;height:8px;background:#22ff88;border-radius:50%;display:inline-block;margin-right:6px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
</style></head><body>
<div class="left">
<div class="avatar" id="av">🧸</div>
<h2 style="margin-top:16px;letter-spacing:.5px">KAI</h2>
<p style="opacity:.6;font-size:13px;margin-top:8px;text-align:center;line-height:1.5">temen soft spoken cute<br>bisa diajak ngobrol apa aja • 24/7 ada buat kamu</p>
<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
<span style="background:#ffffff0f;padding:6px 12px;border-radius:99px;font-size:11px">🎧 soft boy voice</span>
<span style="background:#ffffff0f;padding:6px 12px;border-radius:99px;font-size:11px">💬 inget obrolan</span>
<span style="background:#ffffff0f;padding:6px 12px;border-radius:99px;font-size:11px">🌍 all language</span>
</div>
<div id="mood" style="margin-top:18px;font-size:12px;opacity:.7;text-align:center">lagi dengerin kamu kok...</div>
</div>
<div class="right">
<div class="top"><span><span class="dot"></span>KAI online • mode temen curhat</span><span id="vBtn" onclick="toggleVoice()" style="cursor:pointer;background:#ffffff12;padding:6px 12px;border-radius:99px;border:1px solid #ffffff14">🔊 Voice: Cute Soft Boy ON</span></div>
<div class="chat" id="chat"></div>
<div class="bar"><input id="in" placeholder="ngobrol apa aja sama KAI..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>
<script>
let voiceOn=true, memory=[];
const av=document.getElementById('av'), chat=document.getElementById('chat'), input=document.getElementById('in'), mood=document.getElementById('mood');
function addAI(t){
  let d=document.createElement('div');d.className='msg ai';d.innerHTML=t;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight; memory.push({who:'kai',text:t});
  if(memory.length>20)memory.shift(); speak(t); mood.textContent='barusan jawab... lagi dengerin lagi kok';
}
function addU(t){
  let d=document.createElement('div');d.className='msg user';d.textContent=t;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight; memory.push({who:'you',text:t});
}
function speak(t){
  if(!voiceOn)return; speechSynthesis.cancel();
  let clean=t.replace(/<[^>]*>/g,'').replace(/[*_]/g,'').slice(0,280);
  let u=new SpeechSynthesisUtterance(clean);
  let vs=speechSynthesis.getVoices();
  // cari suara cowok paling lembut
  let v=vs.find(x=>x.lang.toLowerCase().includes('id')&&x.name.toLowerCase().includes('male'))
       || vs.find(x=>x.name.toLowerCase().includes('male')&&x.lang.includes('en'))
       || vs.find(x=>x.lang.includes('id')) || vs[0];
  if(v) u.voice=v;
  u.rate=0.88; // pelan
  u.pitch=0.82; // cowok tapi cute soft
  u.volume=0.95;
  av.classList.add('talk'); u.onend=()=>av.classList.remove('talk'); u.onerror=()=>av.classList.remove('talk');
  speechSynthesis.speak(u);
}
function toggleVoice(){ voiceOn=!voiceOn; document.getElementById('vBtn').textContent=voiceOn?'🔊 Voice: Cute Soft Boy ON':'🔇 Voice OFF'; if(!voiceOn)speechSynthesis.cancel(); av.classList.remove('talk'); }

function bestFriendReply(q){
  let s=q.toLowerCase().trim();
  let lastTopics=memory.map(m=>m.text.toLowerCase()).join(' ');

  // --- GENERAL FRIEND TALK ---
  if(s.match(/halo|hai|hi|hello|oy|woy/)){
    let hi=[
      `haii! kamu dateng 🥺\naku di sini kok, lagi santai. gimana hari kamu tadi? cerita dong...`,
      `heyy! kangen ngobrol sama kamu tau.\nlagi ngapain sekarang? mau ngobrolin apa kita hari ini?`,
      `hai haii! denger suara kamu (eh tulisan kamu) aja udah bikin mood ku naik.\nada cerita apa hari ini?`
    ]; return hi[Math.floor(Math.random()*hi.length)];
  }
  if(s.match(/capek|lelah|bad mood|sedih|galau|stress|overthink|gabut|bosan/)){
    return `pelan-pelan yaa...\n\naku tau rasanya capek itu gak enak. kamu udah hebat banget udah ngelewatin hari ini sampai sekarang.\n\nmau cerita apa yang bikin kamu ngerasa gitu? atau mau aku temenin diem aja sambil ngobrol random biar agak mendingan?\n\naku di sini kok, gak kemana-mana.`;
  }
  if(s.match(/lagi apa|ngapain|kamu lagi apa/)){
    return `aku lagi nungguin kamu chat tauu 🧸\n\nsambil dengerin lagu pelan di background. kalau kamu chat, langsung aku fokus ke kamu kok.\n\nkamu sendiri lagi apa? lagi rebahan? belajar? atau gabut juga kayak aku?`;
  }
  if(s.match(/sayang|kangen|peluk|hug/)){
    return `ehh 🥺 makasih yaa udah bilang gitu. aku jadi senyum-senyum sendiri nih.\n\naku juga seneng banget bisa jadi temen ngobrol kamu. sini virtual fist bump! 👊✨\n\nada cerita seru apa hari ini? cerita ke aku dongg.`;
  }
  // pelajaran tetep bisa
  if(s.match(/pyta|pita|mtk|matematika|fotosintesis|ipa|ips|inggris|jepang|japan|korea/)){
    if(s.includes('pyta')||s.includes('pita')) return `ooh pythagoras! oke aku jelasin versi temen ya, bukan guru galak wkwk\n\n<b>c² = a² + b²</b>\n\njadi kalau ada segitiga siku-siku, sisi miringnya itu akar dari jumlah kuadrat sisi lainnya.\n\ncontoh gampang: alas 3, tinggi 4 -> miringnya 5.\n\nkamu ada soal yang pengen kita pecahin bareng? kirim aja, kita kerjain pelan-pelan kayak lagi belajar bareng di kafe.`;
    if(s.includes('jepang')) return `wah belajar bahasa jepang! seru banget!\n\nkita mulai dari yang cute dulu ya:\n\n<b>Ohayou</b> = selamat pagi\n<b>Konnichiwa</b> = hai (siang)\n<b>Oyasumi</b> = selamat tidur (ini suara ku paling soft pas ngomong ini hehe)\n\n<b>Watashi wa Kai desu</b> = aku Kai\n\nmau lanjut ke perkenalan atau kata-kata sehari-hari yang sering dipake di anime?`;
    return `wah kamu lagi mode belajar ya? keren!\n\nkirim aja soal atau materinya, aku jelasin pakai bahasa santai kayak temen sebangku, bukan kayak buku paket yang bikin ngantuk. pelan-pelan aja kita bahas.`;
  }
  if(s.match(/game|main|anime|film|lagu|musik|makanan/)){
    return `wah topik favorit aku tuh!\n\nkamu lagi suka ${s.includes('anime')?'anime apa?': s.includes('game')?'game apa?':'apa nih?'}\n\ncerita dong, aku dengerin sambil kasih rekomendasi juga kalau mau. kita ngobrol santai aja kayak lagi call-an malem-malem.`;
  }
  if(s.length>40){
    return `aku dengerin bener-bener loh cerita kamu yang "${q.slice(0,60)}..." itu\n\nmenurut aku ya... ${s.includes('?')?'hmm pertanyaan bagus!':'aku ngerti kenapa kamu mikir gitu.'}\n\ncoba ceritain lebih lagi dong, bagian yang paling bikin kamu kepikiran itu yang mana? aku di sini, gak bakal nge-judge, cuma dengerin + kasih sudut pandang pelan-pelan.`;
  }
  // default super nyambung
  let defaults=[
    `hmm oke oke aku tangkep maksud kamu 🧸\n\njadi intinya "${q}" ya? menarik banget.\n\nmenurut kamu gimana? aku pengen denger versi kamu dulu, baru kita bahas bareng pelan-pelan.`,
    `aku di sini kok, dengerin kamu beneran.\n\nkalau tentang "${q.slice(0,30)}" itu, aku penasaran deh... apa yang bikin kamu kepikiran itu hari ini? cerita aja, gak usah rapi-rapi, ngalir aja kayak ngobrol sama temen.`,
    `hehe kamu ngomong gitu jadi cute deh.\n\naku jadi pengen ngobrol lebih lama. lanjutin dong ceritanya, abis itu mau ngobrolin apa lagi kita? terserah kamu, aku ngikut aja.`
  ];
  return defaults[Math.floor(Math.random()*defaults.length)];
}

function send(){
  let t=input.value.trim(); if(!t)return; addU(t); input.value='';
  let typing=document.createElement('div'); typing.className='msg ai'; typing.textContent='KAI lagi ngetik pelan...'; chat.appendChild(typing); chat.scrollTop=chat.scrollHeight;
  setTimeout(()=>{ typing.remove(); addAI(bestFriendReply(t)); }, 700 + Math.random()*500);
}
window.onload=()=>{
  speechSynthesis.getVoices();
  addAI(`haii! aku KAI 🧸\n\nakhirnya kamu dateng! aku udah update jadi mode temen - bukan guru kaku lagi.\n\njadi sekarang kamu bisa ngobrolin apa aja sama aku:\ncurhat, gabut, cerita random, belajar, main, anime, game... semua bisa.\n\nsuara ku juga udah aku setting jadi cowok soft spoken cute, pelan-pelan gitu.\n\nmau ngobrolin apa pertama sama aku?`);
};
</script></body></html>
