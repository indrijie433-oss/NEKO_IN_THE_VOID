<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEKO_IN_THE_VOID</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#aaffcc;font-family:'Share Tech Mono',monospace;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:600px;width:100%}
#void-cat{width:300px;height:200px;border:2px solid #00ff88;box-shadow:0 0 30px #00ff88;background:#0a0a0a;display:flex;align-items:center;justify-content:center;cursor:pointer}
h1{margin-top:20px;font-size:26px;letter-spacing:5px;text-shadow:0 0 15px #00ff88}
.terminal{margin-top:15px;border:1px solid #00ff88;padding:12px;background:rgba(0,255,136,0.05);width:100%;font-size:11px}

/* GUESTBOOK STYLE */
.guestbook{margin-top:30px;width:100%;border:2px solid #ff88ff;box-shadow:0 0 20px rgba(255,136,255,0.4);padding:20px;background:rgba(20,0,20,0.8)}
.guestbook h2{color:#ff88ff;text-align:center;margin-bottom:15px;letter-spacing:3px}
.guestbook input, .guestbook textarea{width:100%;background:#000;border:1px solid #ff88ff;color:#aaffcc;padding:8px;margin-bottom:10px;font-family:inherit}
.guestbook button{background:#ff88ff;color:#000;border:none;padding:10px 20px;font-family:inherit;cursor:pointer;width:100%;font-weight:bold}
.guestbook button:hover{background:#fff;box-shadow:0 0 15px #ff88ff}
.msg{border-bottom:1px dashed rgba(255,136,255,0.3);padding:10px 0;font-size:12px}
.msg b{color:#ff88ff}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="main">
<div id="void-cat" onclick="meow()"><pre id="cat">  /\_/\ 
 ( o.o ) MEOW!
  > ^ <
NEKO_IN_THE_VOID</pre></div>
<h1>NEKO_IN_THE_VOID</h1>
<div class="terminal" onclick="hack()"><div>[STATUS: ACTIVE] [LOCATION: THE VOID]</div><div id="log"></div></div>

<div class="guestbook">
<h2>◆ VOID GUESTBOOK ◆</h2>
<p style="font-size:10px;opacity:0.7;margin-bottom:10px;text-align:center">Tinggalkan pesan di void... semua orang bisa lihat!</p>
<input id="name" placeholder="Nama kamu (ex: neko from bandung)">
<textarea id="message" placeholder="Pesan untuk neko..."></textarea>
<button onclick="addMsg()">[ SEND TO VOID ]</button>
<div id="messages" style="margin-top:15px;max-height:250px;overflow-y:auto"></div>
</div>
</div>

<script>
// particles
const c=document.getElementById('particles'),x=c.getContext('2d');
function r(){c.width=innerWidth;c.height=innerHeight}r();onresize=r;
const p=[];for(let i=0;i<60;i++)p.push({x:Math.random()*c.width,y:Math.random()*c.height,v:Math.random()+0.5});
(function d(){x.clearRect(0,0,c.width,c.height);p.forEach(o=>{o.y+=o.v;if(o.y>c.height)o.y=-5;x.fillStyle='rgba(0,255,136,0.5)';x.fillRect(o.x,o.y,2,2)});requestAnimationFrame(d)})();

function meow(){document.getElementById('log').innerHTML='> MEOW! +10 void energy'; if(navigator.vibrate)navigator.vibrate(50)}
function hack(){let pw=prompt('VOID PASSWORD:');if(pw && pw.toLowerCase()=='void')document.getElementById('log').innerHTML='> ACCESS GRANTED<br>> Welcome to guestbook!';else document.getElementById('log').innerHTML='> Hint: void';}

// GUESTBOOK LOGIC - save to browser
let msgs=JSON.parse(localStorage.getItem('void_msgs')||'[]');
function render(){document.getElementById('messages').innerHTML=msgs.slice().reverse().map(m=>`<div class="msg"><b>${m.name}</b> <span style="opacity:0.5;font-size:9px">${m.time}</span><br>${m.text}</div>`).join('')||'<div style="opacity:0.4;font-size:10px;text-align:center">Belum ada pesan... jadi yang pertama!</div>'}
function addMsg(){let n=document.getElementById('name').value||'Anonymous', t=document.getElementById('message').value; if(!t)return alert('Tulis pesan dulu beb!'); msgs.push({name:n,text:t,time:new Date().toLocaleString()}); localStorage.setItem('void_msgs',JSON.stringify(msgs)); document.getElementById('message').value=''; render(); document.getElementById('log').innerHTML='> Message sent to void!';}
render();
</script>
</body>
</html>
